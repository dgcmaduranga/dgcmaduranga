<svg width="1000" height="300" viewBox="0 0 1000 300"
     xmlns="http://www.w3.org/2000/svg">

  <defs>
    <!-- Premium dark background -->
    <linearGradient id="background" x1="0" y1="0" x2="1000" y2="300">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="45%" stop-color="#07152F"/>
      <stop offset="100%" stop-color="#082F49"/>
    </linearGradient>

    <!-- Accent gradient -->
    <linearGradient id="accent" x1="250" y1="0" x2="750" y2="0">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>

    <!-- Glow -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      .name {
        font-family: Arial, Helvetica, sans-serif;
        font-size: 52px;
        font-weight: 700;
        letter-spacing: 6px;
        fill: #F8FAFC;
      }

      .role {
        font-family: "Courier New", monospace;
        font-size: 25px;
        font-weight: 600;
        fill: #38BDF8;
      }

      .small {
        font-family: Arial, Helvetica, sans-serif;
        font-size: 12px;
        letter-spacing: 5px;
        fill: #94A3B8;
      }
    </style>
  </defs>


  <!-- BACKGROUND -->
  <rect width="1000" height="300" rx="18" fill="url(#background)"/>


  <!-- DECORATIVE GLOWS -->
  <circle cx="90" cy="55" r="115" fill="#2563EB" opacity="0.09">
    <animate attributeName="opacity"
             values="0.06;0.13;0.06"
             dur="5s"
             repeatCount="indefinite"/>
  </circle>

  <circle cx="925" cy="250" r="145" fill="#06B6D4" opacity="0.08">
    <animate attributeName="opacity"
             values="0.05;0.12;0.05"
             dur="6s"
             repeatCount="indefinite"/>
  </circle>


  <!-- TOP DETAILS -->
  <circle cx="40" cy="32" r="4" fill="#38BDF8"/>
  <circle cx="56" cy="32" r="4" fill="#2563EB"/>
  <circle cx="72" cy="32" r="4" fill="#22D3EE"/>

  <text x="92" y="37"
        font-family="Courier New, monospace"
        font-size="11"
        fill="#64748B"
        letter-spacing="2">
    DEVELOPER PROFILE
  </text>


  <!-- NAME -->
  <text x="500" y="112"
        text-anchor="middle"
        class="name">
    CHARITH GAMAGE
  </text>


  <!-- GLOW LINE -->
  <rect x="315" y="132"
        width="370" height="2"
        rx="1"
        fill="url(#accent)"
        filter="url(#glow)"/>


  <!-- =============================== -->
  <!-- TYPEWRITER ROLE ANIMATION -->
  <!-- =============================== -->

  <g class="role" text-anchor="middle">

    <!-- Full Stack -->
    <text x="500" y="185">
      Full-Stack Developer
      <animate attributeName="opacity"
               values="0;1;1;0;0"
               keyTimes="0;0.03;0.15;0.19;1"
               dur="20s"
               repeatCount="indefinite"/>
    </text>

    <!-- Mobile -->
    <text x="500" y="185" opacity="0">
      Mobile App Developer
      <animate attributeName="opacity"
               values="0;0;1;1;0;0"
               keyTimes="0;0.20;0.23;0.35;0.39;1"
               dur="20s"
               repeatCount="indefinite"/>
    </text>

    <!-- AI ML -->
    <text x="500" y="185" opacity="0">
      AI/ML Engineer
      <animate attributeName="opacity"
               values="0;0;1;1;0;0"
               keyTimes="0;0.40;0.43;0.55;0.59;1"
               dur="20s"
               repeatCount="indefinite"/>
    </text>

    <!-- Systems -->
    <text x="500" y="185" opacity="0">
      Systems Engineer
      <animate attributeName="opacity"
               values="0;0;1;1;0;0"
               keyTimes="0;0.60;0.63;0.75;0.79;1"
               dur="20s"
               repeatCount="indefinite"/>
    </text>

    <!-- DevOps -->
    <text x="500" y="185" opacity="0">
      DevOps Engineer
      <animate attributeName="opacity"
               values="0;0;1;1;0;0"
               keyTimes="0;0.80;0.83;0.95;0.99;1"
               dur="20s"
               repeatCount="indefinite"/>
    </text>

  </g>


  <!-- CURSOR -->
  <rect x="500" y="198"
        width="3" height="24"
        rx="1"
        fill="#22D3EE">

    <animate attributeName="opacity"
             values="1;0;1"
             dur="0.8s"
             repeatCount="indefinite"/>

  </rect>


  <!-- BOTTOM TAGLINE -->
  <text x="500" y="248"
        text-anchor="middle"
        class="small">
    BUILD • LEARN • ENGINEER • INNOVATE
  </text>


  <!-- ANIMATED BOTTOM WAVES -->
  <path d="M0 273 Q180 245 350 272 T700 265 T1000 270"
        fill="none"
        stroke="#2563EB"
        stroke-width="1.5"
        opacity="0.45">

    <animate attributeName="d"
             dur="7s"
             repeatCount="indefinite"
             values="
             M0 273 Q180 245 350 272 T700 265 T1000 270;
             M0 265 Q180 285 350 260 T700 275 T1000 260;
             M0 273 Q180 245 350 272 T700 265 T1000 270"/>
  </path>

  <path d="M0 283 Q220 260 420 280 T760 275 T1000 280"
        fill="none"
        stroke="#22D3EE"
        stroke-width="1"
        opacity="0.28">

    <animate attributeName="d"
             dur="9s"
             repeatCount="indefinite"
             values="
             M0 283 Q220 260 420 280 T760 275 T1000 280;
             M0 278 Q220 295 420 270 T760 288 T1000 270;
             M0 283 Q220 260 420 280 T760 275 T1000 280"/>
  </path>

</svg>

<svg width="1000" height="300" viewBox="0 0 1000 300"
     xmlns="http://www.w3.org/2000/svg">

  <defs>

    <!-- BACKGROUND -->
    <linearGradient id="background" x1="0" y1="0" x2="1000" y2="300">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="45%" stop-color="#07152F"/>
      <stop offset="100%" stop-color="#082F49"/>
    </linearGradient>

    <!-- TEXT STYLES -->
    <style>
      .name {
        font-family: Arial, Helvetica, sans-serif;
        font-size: 52px;
        font-weight: 700;
        letter-spacing: 6px;
        fill: #F8FAFC;
      }

      .role {
        font-family: "Courier New", monospace;
        font-size: 25px;
        font-weight: 600;
        fill: #38BDF8;
      }

      .small {
        font-family: Arial, Helvetica, sans-serif;
        font-size: 12px;
        letter-spacing: 5px;
        fill: #94A3B8;
      }
    </style>


    <!-- ========================================== -->
    <!-- 1. SOFTWARE ENGINEER -->
    <!-- ========================================== -->

    <clipPath id="clip1">
      <rect x="370" y="150" width="0" height="50">

        <animate
          id="type1"
          attributeName="width"
          from="0"
          to="260"
          dur="1.7s"
          begin="0s;restart.end"
          fill="freeze"/>

        <animate
          id="delete1"
          attributeName="width"
          from="260"
          to="0"
          dur="1.2s"
          begin="type1.end+1.3s"
          fill="freeze"/>

      </rect>
    </clipPath>


    <!-- ========================================== -->
    <!-- 2. FULL-STACK DEVELOPER -->
    <!-- ========================================== -->

    <clipPath id="clip2">
      <rect x="340" y="150" width="0" height="50">

        <animate
          id="type2"
          attributeName="width"
          from="0"
          to="320"
          dur="1.8s"
          begin="delete1.end+0.3s"
          fill="freeze"/>

        <animate
          id="delete2"
          attributeName="width"
          from="320"
          to="0"
          dur="1.3s"
          begin="type2.end+1.3s"
          fill="freeze"/>

      </rect>
    </clipPath>


    <!-- ========================================== -->
    <!-- 3. MOBILE APP DEVELOPER -->
    <!-- ========================================== -->

    <clipPath id="clip3">
      <rect x="340" y="150" width="0" height="50">

        <animate
          id="type3"
          attributeName="width"
          from="0"
          to="320"
          dur="1.8s"
          begin="delete2.end+0.3s"
          fill="freeze"/>

        <animate
          id="delete3"
          attributeName="width"
          from="320"
          to="0"
          dur="1.3s"
          begin="type3.end+1.3s"
          fill="freeze"/>

      </rect>
    </clipPath>


    <!-- ========================================== -->
    <!-- 4. AI/ML ENGINEER -->
    <!-- ========================================== -->

    <clipPath id="clip4">
      <rect x="390" y="150" width="0" height="50">

        <animate
          id="type4"
          attributeName="width"
          from="0"
          to="220"
          dur="1.5s"
          begin="delete3.end+0.3s"
          fill="freeze"/>

        <animate
          id="delete4"
          attributeName="width"
          from="220"
          to="0"
          dur="1.1s"
          begin="type4.end+1.3s"
          fill="freeze"/>

      </rect>
    </clipPath>


   

  <!-- ========================================== -->
  <!-- BACKGROUND -->
  <!-- ========================================== -->

  <rect
    width="1000"
    height="300"
    rx="18"
    fill="url(#background)"
  />


  <!-- ========================================== -->
  <!-- DECORATIVE GLOWS -->
  <!-- ========================================== -->

  <circle
    cx="90"
    cy="55"
    r="115"
    fill="#2563EB"
    opacity="0.09">

    <animate
      attributeName="opacity"
      values="0.06;0.13;0.06"
      dur="5s"
      repeatCount="indefinite"
    />

  </circle>


  <circle
    cx="925"
    cy="250"
    r="145"
    fill="#06B6D4"
    opacity="0.08">

    <animate
      attributeName="opacity"
      values="0.05;0.12;0.05"
      dur="6s"
      repeatCount="indefinite"
    />

  </circle>


  <!-- ========================================== -->
  <!-- TOP DECORATION -->
  <!-- ========================================== -->

  <circle cx="40" cy="32" r="4" fill="#38BDF8"/>
  <circle cx="56" cy="32" r="4" fill="#2563EB"/>
  <circle cx="72" cy="32" r="4" fill="#22D3EE"/>

  <text
    x="92"
    y="37"
    font-family="Courier New, monospace"
    font-size="11"
    fill="#64748B"
    letter-spacing="2">
    DEVELOPER PROFILE
  </text>


  <!-- ========================================== -->
  <!-- NAME -->
  <!-- ========================================== -->

  <text
    x="500"
    y="112"
    text-anchor="middle"
    class="name">
    CHARITH GAMAGE
  </text>


  <!-- ========================================== -->
  <!-- TYPEWRITER ROLES -->
  <!-- ========================================== -->

  <!-- SOFTWARE ENGINEER -->
  <text
    x="370"
    y="180"
    class="role"
    clip-path="url(#clip1)">
    Software Engineer
  </text>


  <!-- FULL-STACK DEVELOPER -->
  <text
    x="340"
    y="180"
    class="role"
    clip-path="url(#clip2)">
    Full-Stack Developer
  </text>


  <!-- MOBILE APP DEVELOPER -->
  <text
    x="340"
    y="180"
    class="role"
    clip-path="url(#clip3)">
    Mobile App Developer
  </text>


  <!-- AI/ML ENGINEER -->
  <text
    x="390"
    y="180"
    class="role"
    clip-path="url(#clip4)">
    AI/ML Engineer
  </text>


  <!-- SYSTEMS ENGINEER -->
  <text
    x="370"
    y="180"
    class="role"
    clip-path="url(#clip5)">
    Systems Engineer
  </text>


  <!-- ========================================== -->
  <!-- BOTTOM TAGLINE -->
  <!-- ========================================== -->

  <text
    x="500"
    y="235"
    text-anchor="middle"
    class="small">
    BUILD • LEARN • ENGINEER • INNOVATE
  </text>


  <!-- ========================================== -->
  <!-- ANIMATED BOTTOM WAVE 1 -->
  <!-- ========================================== -->

  <path
    d="M0 273 Q180 245 350 272 T700 265 T1000 270"
    fill="none"
    stroke="#2563EB"
    stroke-width="1.5"
    opacity="0.45">

    <animate
      attributeName="d"
      dur="7s"
      repeatCount="indefinite"
      values="
        M0 273 Q180 245 350 272 T700 265 T1000 270;
        M0 265 Q180 285 350 260 T700 275 T1000 260;
        M0 273 Q180 245 350 272 T700 265 T1000 270
      "
    />

  </path>


  <!-- ========================================== -->
  <!-- ANIMATED BOTTOM WAVE 2 -->
  <!-- ========================================== -->

  <path
    d="M0 283 Q220 260 420 280 T760 275 T1000 280"
    fill="none"
    stroke="#22D3EE"
    stroke-width="1"
    opacity="0.28">

    <animate
      attributeName="d"
      dur="9s"
      repeatCount="indefinite"
      values="
        M0 283 Q220 260 420 280 T760 275 T1000 280;
        M0 278 Q220 295 420 270 T760 288 T1000 270;
        M0 283 Q220 260 420 280 T760 275 T1000 280
      "
    />

  </path>


  <!-- ========================================== -->
  <!-- LOOP RESTART -->
  <!-- ========================================== -->

  <rect width="0" height="0">

    <animate
      id="restart"
      attributeName="width"
      from="0"
      to="0"
      dur="0.4s"
      begin="delete5.end"
      fill="freeze"
    />

  </rect>

</svg>
